{% extends "base.html" %}

{% block sayfa_baslik %}{{ baslik }}{% endblock %}

{% block icerik %}
<div class="main-container">
    <div class="auth-card">
        <h1 class="page-title" style="text-align: center;">Kayıt Ol</h1>
        <p class="section-lead" style="text-align: center;">Dosyalarınızı yönetmek ve geçmişi kaydetmek için ücretsiz hesap oluşturun.</p>
        
        <form class="auth-form" method="POST" action="{{ url_for('kayit') }}" style="max-width: 400px; margin: 2rem auto;">
            <label class="field-label" for="kullanici_adi">Kullanıcı Adı</label>
            <input class="input-text" id="kullanici_adi" name="kullanici_adi" type="text" autocomplete="username" placeholder="Kullanıcı adınız" required>

            <label class="field-label" for="eposta">E-posta</label>
            <input class="input-text" id="eposta" name="eposta" type="email" autocomplete="email" placeholder="ornek@eposta.com" required>

            <label class="field-label" for="sifre">Şifre</label>
            <input class="input-text" id="sifre" name="sifre" type="password" autocomplete="new-password" placeholder="••••••••" required minlength="6">

            <button type="submit" class="btn-convert" style="margin-top: 1rem;">Kayıt Ol</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--color-text-mut);">
            Zaten hesabınız var mı? <a href="{{ url_for('giris') }}" style="color: var(--color-accent); font-weight: 500;">Giriş Yap</a>
        </p>
    </div>
</div>
{% endblock %}
